version: '3.4'
services:
  ## S3 (s3mock)
  s3mock:
    image: adobe/s3mock:5.2.3
    ports:
      - "9100:9090"
    environment:
      # creates the bucket on startup; it is populated by loadbucket
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: data
    healthcheck:
      test: wget -q -O /dev/null http://s3mock:9090/favicon.ico
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  # Upload sample data
  loadbucket:
    image: amazon/aws-cli:2.37.4
    depends_on:
      s3mock:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3mock:9090 s3 cp --recursive /data s3://data/data/
      "
    environment:
      AWS_ACCESS_KEY_ID: s3mock
      AWS_SECRET_ACCESS_KEY: s3mock
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./data:/data

  ## Image Server
  image-server:
    build:
      context: .
      target: image
    depends_on:
      loadbucket:
        condition: service_completed_successfully
    environment:
      - SOURCE_STATIC=S3Source
      - S3SOURCE_ENDPOINT=http://s3mock:9090/
      # s3mock ignores these, but Cantaloupe's AWS SDK won't send requests without some credentials
      - S3SOURCE_ACCESS_KEY_ID=s3mock
      - S3SOURCE_SECRET_KEY=s3mock
      - S3SOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX=data/
      - S3SOURCE_BASICLOOKUPSTRATEGY_BUCKET_NAME=data
    ports:
      - "8182:8182"
    healthcheck:
      test: curl http://image-server:8182/
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s
